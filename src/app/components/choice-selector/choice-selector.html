<span class="label" [id]="key + '-label'">{{ label | translate }}</span>

<div class="selector" [class.open]="open()">
  <button
    #toggle
    type="button"
    class="selector-button"
    [id]="key + '-button'"
    [attr.aria-labelledby]="key + '-label ' + key + '-button'"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="key + '-list'"
    (click)="switchOpen()"
  >
    <span class="selector-summary">{{ summary() }}</span>
    <span class="material-symbols-outlined" aria-hidden="true">expand_more</span>
  </button>

  @if (open()) {
    <div
      class="selector-list"
      [id]="key + '-list'"
      role="group"
      [attr.aria-labelledby]="key + '-label'"
      [formGroup]="group"
    >
      <div class="selector-shortcuts">
        <button type="button" (click)="checkAll(true)">{{ 'choices.all' | translate }}</button>
        <button type="button" (click)="checkAll(false)">{{ 'choices.none' | translate }}</button>
      </div>

      @for (option of options; track option.value; let i = $index) {
        @if (startsGroup(i) && option.group) {
          <p class="selector-group">{{ option.group | translate }}</p>
        }
        <label class="selector-option">
          <input type="checkbox" [formControlName]="option.value" />
          <span class="material-symbols-outlined" aria-hidden="true">{{ option.icon }}</span>
          {{ option.name | translate }}
        </label>
      }
    </div>
  }
</div>

<p class="error">
  @if (group.hasError('noneChosen')) {
    {{ errorMessage | translate }}
  }
</p>
