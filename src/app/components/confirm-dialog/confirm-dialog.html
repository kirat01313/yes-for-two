<dialog
  #dialog
  class="confirm"
  aria-labelledby="confirm-title"
  aria-describedby="confirm-message"
  (close)="closed()"
  (mousedown)="markPress($event)"
  (click)="closeIfOutside($event)"
>
  <div class="confirm-body">
    <span class="material-symbols-outlined confirm-icon" aria-hidden="true">delete</span>
    <h2 id="confirm-title">{{ 'confirm.title' | translate }}</h2>
    <p id="confirm-message">{{ message() }}</p>
    <div class="confirm-actions">
      <button type="button" class="button button-soft" (click)="answer(false)">
        {{ 'confirm.cancel' | translate }}
      </button>
      <button type="button" class="button button-primary" (click)="answer(true)">
        {{ 'confirm.delete' | translate }}
      </button>
    </div>
  </div>
</dialog>
