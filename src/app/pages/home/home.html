<section class="stage" aria-labelledby="home-title">
  <video
    class="stage-video"
    src="videos/woman-eyes.mp4"
    autoplay
    loop
    playsinline
    [muted]="true"
    aria-hidden="true"
  ></video>
  <div class="stage-shade" aria-hidden="true"></div>

  <div class="stage-text">
    <h1 id="home-title">{{ 'app.tagline' | translate }} <span class="yes">{{ 'app.yes' | translate }}</span>.</h1>
    <p>{{ 'home.subtitle' | translate }}</p>

    <div class="stage-actions">
      <a class="button button-primary" routerLink="/restaurant">
        <span class="material-symbols-outlined" aria-hidden="true">restaurant</span>
        {{ 'home.startWithDinner' | translate }}
      </a>
      <a class="button button-glass" routerLink="/" fragment="how-it-works">
        <span class="material-symbols-outlined" aria-hidden="true">explore</span>
        {{ 'home.seeHowItWorks' | translate }}
      </a>
    </div>
  </div>

  <span class="scroll-hint" aria-hidden="true">
    <span class="material-symbols-outlined">keyboard_arrow_down</span>
  </span>
  
<section class="letter" [attr.aria-label]="'home.poemLabel' | translate">
  <figure>
    <blockquote>
      @for (verse of verses; track verse; let odd = $odd) {
        <p [class.indented]="odd">{{ verse | translate }}</p>
      }
    </blockquote>
    <figcaption>Álvaro de Campos</figcaption>
  </figure>
</section>
</section>
