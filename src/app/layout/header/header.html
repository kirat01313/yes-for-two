<header class="header">
  <div class="inner">
    <a class="logo" routerLink="/">{{ 'app.name' | translate }}</a>

    <nav class="menu" [attr.aria-label]="'nav.main' | translate">
      @for (link of links(); track link.path) {        
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
        >
          {{ link.label | translate }}
        </a>
      }
    </nav>

    <div class="account-actions">
      <button
        type="button"
        class="language-switch"
        [attr.aria-label]="'language.switchLabel' | translate"
        (click)="language.toggle()"
      >
        {{ 'language.switch' | translate }}
      </button>
      @if (auth.signedIn()) {
        <app-account-menu />
      } @else {
        <a class="button button-outline button-small" routerLink="/sign-in">
          {{ 'account.signIn' | translate }}
        </a>
        <a class="button button-primary button-small" routerLink="/sign-in" [queryParams]="{ mode: 'create' }">
          {{ 'account.createAccount' | translate }}
        </a>
      }
    </div>
  </div>
</header>
